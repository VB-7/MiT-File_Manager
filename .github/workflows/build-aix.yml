name: Build AIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Install ant
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ant
      - name: Fetch AI2 deps
        run: git clone --depth 1 https://github.com/mit-cml/extension-deps.git lib/appinventor
      - name: Build extension
        run: |
          set +e
          ant extensions > /tmp/build.log 2>&1
          CODE=$?
          python3 - <<'PYEOF'
          import re
          txt = open('/tmp/build.log', encoding='utf-8', errors='replace').read()
          lines = txt.split('\n')
          out = []
          for i, l in enumerate(lines):
            if re.search(r'error|cannot find symbol|BUILD FAILED|FAILED|Exception|symbol\s*:|location\s*:', l, re.I):
              out.append(l)
              for k in range(1, 4):
                if i + k < len(lines):
                  out.append('  ' + lines[i + k])
              if len(out) > 120:
                break
          if not out:
            out = lines[-20:]
          for l in out[:120]:
            l = l.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:1500]
            if l.strip():
              print('::error file=build.xml,line=1::' + l)
          PYEOF
          exit $CODE
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: Fv7_Manager_File
          path: out/*.aix
