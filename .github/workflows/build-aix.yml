name: Build AIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check facade sync
        run: node tools/gen_facade.mjs --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Install ant
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ant
      - name: Fetch AI2 deps
        run: git clone --depth 1 https://github.com/mit-cml/extension-deps.git lib/appinventor
      - name: Build extension
        run: ant extensions
      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: Fv7_Manager_File
          path: out/*.aix
